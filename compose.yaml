# Compose uses this project name to group containers, networks, and volumes.
# It keeps this environment separate from the original prototype's project.
name: voc-dev

# Define the containers that make up this environment.
services:
  # Service name used in commands such as: docker compose exec workspace bash
  workspace:
    # Build the image using this directory as the context and its Dockerfile.
    build: .

    # Add a small init process to forward signals and reap exited child processes.
    init: true

    # Set environment variables inside the running container.
    # These override matching Dockerfile ENV defaults; they do not create mounts.
    environment:
      VOC_DATA_DIR: /data
      ZENML_CONFIG_PATH: /data/zenml-client
      ZENML_ANALYTICS_OPT_IN: "false"
      MLFLOW_DISABLE_AGENT_HINT: "1"
      VOC_SEED_PATH: /seed/dataset.db
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?Set JUPYTER_TOKEN in .env}

    # Mount storage into this service's container. Both mounts are writable.
    volumes:
      # BIND MOUNT: expose your actual host repository inside the container.
      # source: . means the directory containing this Compose file (your voc repo).
      # target is the path where that directory appears INSIDE the container.
      # Example: host voc/src/example.py <-> container /workspace/src/example.py.
      # Edits from either side affect the same files; this is not a separate copy.
      # Deleting a file through /workspace also deletes that file on the host.
      # This mount hides the image's existing /workspace contents while mounted.
      # Dependencies remain visible because the Dockerfile puts them in /opt/venv.
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ${VOC_SEED_DIR:?Set VOC_SEED_DIR in .env}
        target: /seed
        read_only: true
        bind:
          create_host_path: false

      # NAMED VOLUME: mount Docker-managed storage at /data in the container.
      # Short syntax is SOURCE:TARGET; "runtime" refers to the declaration below.
      # App writes such as /data/raw/raw.db go into this volume.
      # This is NOT your repository's data/ folder. On macOS, Docker Desktop
      # manages this storage inside its Linux VM, rather than a chosen host folder.
      # The volume survives container removal and ordinary docker compose down.
      # A later up with the same project/volume configuration reuses its data.
      # docker compose down --volumes explicitly removes this named volume.
      - runtime:/data
    ports:
      - "127.0.0.1:${VOC_ZENML_PORT:-8237}:8237"
      - "127.0.0.1:${VOC_MLFLOW_PORT:-5000}:5000"
      - "127.0.0.1:${VOC_JUPYTER_PORT:-8888}:8888"
      - "127.0.0.1:${VOC_DASHBOARD_PORT:-8050}:8050"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; [urllib.request.urlopen('http://127.0.0.1:'+str(p),timeout=5).close() for p in (8237,5000,8050,8888)]"]
      interval: 15s
      timeout: 25s
      start_period: 90s
      retries: 5
    # Allow up to 45 seconds for the container to stop before forcibly killing it.
    stop_grace_period: 45s

# Declare the named volumes used above; this declaration alone mounts nothing.
# With project name voc-dev, Docker normally names this volume voc-dev_runtime.
# An empty definition uses Docker's default volume configuration.
volumes:
  runtime:
