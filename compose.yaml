services:
  workspace:
    # Build the image using the Dockerfile in this repository.
    build: .
    # Add a small init process to forward signals and reap exited child processes.
    init: true
    environment:
      # Tell Python where runtime data lives INSIDE the container.
      # data_root() reads this value to build database, cache and log paths.
      # This variable does not create or mount a directory by itself.
      VOC_DATA_DIR: /workspace/data
      # Select the shared storage policy read by load_storage().
      VOC_STORAGE_CONFIG: /workspace/config/storage.toml
      # Runtime credentials supplied by scripts/start.sh, never image build arguments.
      # Empty fallbacks let management commands work without loading credentials.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Non-secret settings from root .env; region is exposed under both AWS names.
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      VOC_MEMBER_ID: ${VOC_MEMBER_ID:-}
      VOC_DATASET_SOURCE: ${VOC_DATASET_SOURCE:-}
      VOC_ARTIFACT_DESTINATION: ${VOC_ARTIFACT_DESTINATION:-}
    volumes:
      # Expose the host repository inside the container; edits affect the same files.
      - type: bind
        # Relative to this Compose file: the repository directory on your host.
        source: .
        # Container path for the repo. Host data/ therefore appears at /workspace/data.
        # Files persist on the host after just down; no separate data mount is needed.
        target: /workspace
    healthcheck:
      # For this lesson, healthy means Python can import the VOC package.
      test: ["CMD", "python", "-c", "import voc"]
      # Check every 15 seconds; each attempt has a 10-second timeout.
      interval: 15s
      timeout: 10s
      # Mark unhealthy after 12 consecutive failures following the startup grace period.
      retries: 12
      start_period: 20s
