# Adds runtime credentials and an optional artifact destination selection.
# Start through `just up-aws`, which resolves 1Password references first.
services:
  workspace:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      VOC_MEMBER_ID: ${VOC_MEMBER_ID:-}
      VOC_SMOKE_KEY: ${VOC_SMOKE_KEY:-}
      VOC_ARTIFACT_DESTINATION: ${VOC_ARTIFACT_DESTINATION:-}
