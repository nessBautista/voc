# Adds runtime credentials and an optional artifact destination selection.
# `just up` selects 1Password or an ignored credential file before applying this.
services:
  workspace:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in your selected AWS credential source}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in your selected AWS credential source}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:?Set AWS_REGION in your selected AWS credential source}
      AWS_DEFAULT_REGION: ${AWS_REGION:?Set AWS_REGION in your selected AWS credential source}
      AWS_BUCKET: ${AWS_BUCKET:?Set AWS_BUCKET in your selected AWS credential source}
      VOC_MEMBER_ID: ${VOC_MEMBER_ID:?Set VOC_MEMBER_ID in your selected AWS credential source}
      VOC_SMOKE_KEY: ${VOC_SMOKE_KEY:-}
      VOC_ARTIFACT_DESTINATION: ${VOC_ARTIFACT_DESTINATION:-}
      VOC_DATASET_SOURCE: ${VOC_DATASET_SOURCE:-}
