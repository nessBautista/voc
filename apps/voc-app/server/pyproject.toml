# Independent environment for the end-user HTTP application.
[project]
name = "voc-app"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "voc[publications]",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
]

# Test tools are excluded from the application image.
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voc_app"]

[tool.uv.sources]
# Install the shared library, not the Operator's ML/notebook environment.
voc = { path = "../../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
