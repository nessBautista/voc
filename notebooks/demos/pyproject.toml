[project]
name = "voc-topic-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2", "pandas>=2.2,<3", "pyarrow>=18,<24",
    "numpy>=2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2", "plotly==7.1.0",
    "marimo==0.25.0", "marimo-studio==0.2.3",
    "sentence-transformers==5.1.2", "transformers>=4.41,<5",
    "torch>=2.6,<3", "bertopic==0.17.4", "umap-learn==0.5.12", "hdbscan==0.8.44",
    "pysentimiento==0.7.3", "datasets>=3,<6", "openai>=2,<3", "jsonschema>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voc_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
