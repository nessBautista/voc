# Always launched from the repository root with --project-directory .
name: voc-state-app
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    init: true
    ports:
      - "127.0.0.1:${VOC_APP_PORT:-8091}:8000"
    environment:
      VOC_PUBLICATIONS_DIR: /app/catalog
      VOC_APP_STATE_DIR: /app/state
      VOC_PLANNER_MODE: ${VOC_PLANNER_MODE:-fixture}
      VOC_LLM_BASE_URL: ${VOC_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      VOC_LLM_MODEL: ${VOC_LLM_MODEL:-anthropic/claude-sonnet-5.5}
      # Reuse the private OpenRouter credential; no AWS keys enter this container.
      VOC_LLM_API_KEY: ${VOC_LLM_API_KEY:-${OPENROUTER_API_KEY:-}}
      VOC_TURN_TIMEOUT_SECONDS: ${VOC_TURN_TIMEOUT_SECONDS:-45}
    volumes:
      - type: bind
        source: ./data/voc-app/catalog
        target: /app/catalog
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/voc-app/state
        target: /app/state
        bind:
          create_host_path: false
    # Application code and dependencies stay immutable; only app state is writable.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
