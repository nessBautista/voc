# Always launched from the repository root with --project-directory .
name: voc-state-app
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    init: true
    ports:
      - "127.0.0.1:${VOC_APP_PORT:-8091}:8000"
    environment:
      VOC_PUBLICATIONS_DIR: /app/catalog
      VOC_APP_STATE_DIR: /app/state
      VOC_PLANNER_MODE: ${VOC_PLANNER_MODE:-fixture}
      VOC_LLM_BASE_URL: ${VOC_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      VOC_LLM_MODEL: ${VOC_LLM_MODEL:-anthropic/claude-sonnet-5.5}
      # Reuse the private OpenRouter credential; no AWS keys enter this container.
      VOC_LLM_API_KEY: ${VOC_LLM_API_KEY:-${OPENROUTER_API_KEY:-}}
      VOC_MCP_ENABLED: ${VOC_MCP_ENABLED:-false}
      VOC_MCP_TOKEN: ${VOC_MCP_TOKEN:-}
      VOC_MCP_ALLOWED_HOSTS: ${VOC_MCP_ALLOWED_HOSTS:-127.0.0.1:${VOC_APP_PORT:-8091},localhost:${VOC_APP_PORT:-8091},host.docker.internal:${VOC_APP_PORT:-8091},127.0.0.1:8000}
      VOC_MCP_ALLOWED_ORIGINS: ${VOC_MCP_ALLOWED_ORIGINS:-http://127.0.0.1:${VOC_APP_PORT:-8091},http://localhost:${VOC_APP_PORT:-8091}}
      VOC_TURN_TIMEOUT_SECONDS: ${VOC_TURN_TIMEOUT_SECONDS:-45}
      # Login contract from guide 03; the secret arrives through the private loader only.
      VOC_AUTH_MODE: ${VOC_AUTH_MODE:-local}
      VOC_PUBLIC_ORIGIN: ${VOC_PUBLIC_ORIGIN:-http://localhost:${VOC_APP_PORT:-8091}}
      VOC_COGNITO_ISSUER: ${VOC_COGNITO_ISSUER:-}
      VOC_COGNITO_DOMAIN: ${VOC_COGNITO_DOMAIN:-}
      VOC_COGNITO_WEB_CLIENT_ID: ${VOC_COGNITO_WEB_CLIENT_ID:-}
      VOC_COGNITO_NATIVE_CLIENT_ID: ${VOC_COGNITO_NATIVE_CLIENT_ID:-}
      VOC_COGNITO_WEB_CLIENT_SECRET: ${VOC_COGNITO_WEB_CLIENT_SECRET:-}
      VOC_COGNITO_SCOPES: ${VOC_COGNITO_SCOPES:-openid email voc-api/access}
    volumes:
      - type: bind
        source: ./data/voc-app/catalog
        target: /app/catalog
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/voc-app/state
        target: /app/state
        bind:
          create_host_path: false
    # Application code and dependencies stay immutable; only app state is writable.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).close()"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
