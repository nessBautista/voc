# Python environment for the Operator container; it installs the shared VOC package.
[project]
name = "voc-operator"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["voc[publications]"]

# Operator-only tools; both groups are included by default in this project.
[dependency-groups]
# Testing, code checks and notebook-format tools.
dev = ["pytest>=8,<10", "ruff>=0.12", "nbformat>=5,<6"]
# Orchestration, tracking, S3 access, notebooks, plotting and documentation.
# Brackets inside a package string, e.g. zenml[server], request its optional extras.
ml = [
    # Topic discovery and dimensionality reduction used by the BERTopic notebook.
    "bertopic==0.17.4",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "openai>=1.60,<3",  # Optional OpenRouter client in the teaching notebook.
    "jsonschema>=4,<5",  # Check the optional structured topic interpretation.
    "pysentimiento==0.7.3",  # RoBERTuito Spanish text preprocessing in notebooks.
    "datasets>=3,<6",  # Avoid legacy datasets 2.x APIs removed by current PyArrow.
    "sentence-transformers==6.0.0",  # Enforce trust_remote_code=False for local models.
    "transformers>=5.10,<6",
    "torch>=2.6,<3",
    "zenml[server]==0.96.4",
    "mlflow==3.16.1",
    "python-rapidjson<1.15",
    "s3fs>2022.3.0,!=2025.3.1",
    "aws-profile-manager",
    "aiobotocore==3.9.0",
    "jupyterlab>=4,<5",
    "marimo==0.25.0",  # Runtime compatible with the Studio extension.
    "marimo-studio==0.2.3",  # HTML presentation views on the existing Marimo server.
    "matplotlib>=3.9",
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=0.27",
]

# This project defines an environment, not another installable Python package.
[tool.uv]
package = false
default-groups = ["dev", "ml"]

# Local NLP inference uses CPU wheels; keep other packages on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Relative to this file: use the library from the repository root.
voc = { path = "../..", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
