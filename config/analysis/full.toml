# Every review of the pinned releases. Fix the reduction block first; raise the
# clustering values from the 10,000-review reading until the topic count is in
# the tens and the unassigned share stays at most 0.35 (guide 06 of the bundle).
[selection]
kind = "full"

[topics]
backend = "bertopic"

[reduction]
n_neighbors = 15
n_components = 5
min_dist = 0.0
metric = "cosine"
random_state = 42

[clustering]
min_cluster_size = 200
min_samples = 25
metric = "euclidean"
cluster_selection_method = "eom"
