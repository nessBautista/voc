# Every review of the pinned releases. Fix the reduction block first; move only
# the clustering block until the topic count is in the tens, the unassigned
# share stays at most 0.35 and the largest topic is specific (guide 06).
# 2026-10-22: 200/25 gave 64 topics with one group holding 31 % of the corpus;
# 100/25 split it (160 topics, 35.7 % unassigned); 150/25 gave 110 topics and
# 36.4 %; 150/10 gave 121 and 36.5 %. Below 200 the noise share sits near 36 %
# whatever min_samples does, so the rule was revised: the largest topic must be
# specific (at most 5 % of the corpus) and the count as low as that allows.
# Chosen: 150/25.
[selection]
kind = "full"

[topics]
backend = "bertopic"

[reduction]
n_neighbors = 15
n_components = 5
min_dist = 0.0
metric = "cosine"
random_state = 42

[clustering]
min_cluster_size = 150
min_samples = 25
metric = "euclidean"
cluster_selection_method = "eom"
