# ZenML and MLflow consume these settings at startup/setup and pipeline creation.
# Local remains the default while we verify the personal S3 destinations.
artifact_destination = "local"  # local | s3
# Dataset reads are independent: personal catalog (local) or shared releases (s3).
dataset_source = "local"        # local | s3

# Prefixes within the bucket, not filesystem directories or full s3:// URIs.
shared_prefix = "voc/datasets"
members_prefix = "members"

# AWS_BUCKET, AWS_REGION and VOC_MEMBER_ID normally come from aws.refs.env.
# Optional non-secret fallbacks can be added here:
# bucket = "your-team-bucket"
# region = "us-east-2"
# member_id = "your-name"
