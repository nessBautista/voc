# Shared VOC package metadata, read by package installers and pytest.
# Operator dependencies and its lockfile live in docker/operator/.
# [section] groups settings; name = value assigns a setting; # starts a comment.

# Package identity, supported Python versions and core runtime dependencies.
[project]
name = "voc"
version = "0.1.0"
requires-python = ">=3.11,<3.13"  # Python 3.11 or 3.12.
# Version constraints allow ranges (>=, <) or pin one version (==).
dependencies = [
    "click>=8.0,<=8.2.1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",  # Portable embedding validation; no model dependencies.
    "pyarrow>=18,<24",
    "google-play-scraper==1.2.7",
    "boto3>=1.35,<2",
]

# Tell build tools which backend packages our Python code for installation.
[build-system]
requires = ["hatchling"]  # Dependency needed to build this project.
build-backend = "hatchling.build"

# Hatchling configuration: include these three packages in the installable wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/voc", "src/voc_ml", "src/voc_dev"]

# Installation creates the voc terminal command, which calls main() in voc/cli.py.
[project.scripts]
voc = "voc.cli:main"
# Separate command for ML setup and dataset pipelines.
voc-ml = "voc_ml.cli:main"
# Read-only developer storage diagnostics.
voc-dev = "voc_dev.cli:main"

[project.optional-dependencies]
publications = [
    "duckdb==1.5.6",
]

# pytest reads this section when discovering and running tests.
[tool.pytest.ini_options]
testpaths = ["tests"]  # Look for tests here when no test path is specified.
pythonpath = ["src", "."]  # Make source packages and repo helpers importable in tests.
# Register the label used by tests needing AWS or running services.
# tests/conftest.py handles skipping them unless explicitly enabled.
markers = ["live: explicit AWS or running-service acceptance check"]
