# Python project configuration, read by uv, the package builder and pytest.
# [section] groups settings; name = value assigns a setting; # starts a comment.

# Package identity, supported Python versions and core runtime dependencies.
[project]
name = "voc"
version = "0.1.0"
requires-python = ">=3.11,<3.13"  # Python 3.11 or 3.12.
# Version constraints allow ranges (>=, <) or pin one version (==).
dependencies = [
    "click>=8.0,<=8.2.1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",  # Portable embedding validation; no model dependencies.
    "pyarrow>=18,<24",
    "google-play-scraper==1.2.7",
    "boto3>=1.35,<2",
]

# Extra dependency groups selected with uv sync --group dev --group ml.
[dependency-groups]
# Testing, code checks and notebook-format tools.
dev = ["pytest>=8,<10", "ruff>=0.12", "nbformat>=5,<6"]
# Orchestration, tracking, S3 access, notebooks, plotting and documentation.
# Brackets inside a package string, e.g. zenml[server], request its optional extras.
ml = [
    # Topic discovery and dimensionality reduction used by the BERTopic notebook.
    "bertopic==0.17.4",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "openai>=1.60,<3",  # Optional OpenRouter client in the teaching notebook.
    "jsonschema>=4,<5",  # Check the optional structured topic interpretation.
    "pysentimiento==0.7.3",  # RoBERTuito Spanish text preprocessing in notebooks.
    "datasets>=3,<6",  # Avoid legacy datasets 2.x APIs removed by current PyArrow.
    "sentence-transformers==6.0.0",  # Enforce trust_remote_code=False for local models.
    "transformers>=5.10,<6",
    "torch>=2.6,<3",
    "zenml[server]==0.96.4",
    "mlflow==3.16.1",
    "python-rapidjson<1.15",
    "s3fs>2022.3.0,!=2025.3.1",
    "aws-profile-manager",
    "aiobotocore==3.9.0",
    "jupyterlab>=4,<5",
    "marimo==0.25.0",  # Runtime compatible with the Studio extension.
    "marimo-studio==0.2.3",  # HTML presentation views on the existing Marimo server.
    "matplotlib>=3.9",
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=0.27",
]

# Tell build tools which backend packages our Python code for installation.
[build-system]
requires = ["hatchling"]  # Dependency needed to build this project.
build-backend = "hatchling.build"

# Hatchling configuration: include these three packages in the installable wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/voc", "src/voc_ml", "src/voc_dev"]

# Installation creates the voc terminal command, which calls main() in voc/cli.py.
[project.scripts]
voc = "voc.cli:main"
# Separate command for ML setup and dataset pipelines.
voc-ml = "voc_ml.cli:main"
# Read-only developer storage diagnostics.
voc-dev = "voc_dev.cli:main"

# pytest reads this section when discovering and running tests.
[tool.pytest.ini_options]
testpaths = ["tests"]  # Look for tests here when no test path is specified.
pythonpath = ["src", "."]  # Make source packages and repo helpers importable in tests.
# Register the label used by tests needing AWS or running services.
# tests/conftest.py handles skipping them unless explicitly enabled.
markers = ["live: explicit AWS or running-service acceptance check"]

# Local NLP inference uses CPU wheels; keep other packages on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
